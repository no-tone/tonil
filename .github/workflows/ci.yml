name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Applies to every job below, none of which has its own `permissions` key.
#
# Both jobs do exactly one privileged thing - clone this repository - so read
# access to its contents is the whole requirement. Deploying does not need
# more: it authenticates to Cloudflare with CLOUDFLARE_API_TOKEN, which has
# nothing to do with the GITHUB_TOKEN this scopes.
#
# Written down rather than left to the default, because the default is not a
# fixed thing: it is whatever the repository or organisation is set to, it was
# read-write for anything created before February 2023, and someone who has
# never seen this file can change it. Stating it means the workflow keeps the
# permissions it actually needs if it is forked, copied into another
# organisation, or the account default moves under it.
permissions:
  contents: read

jobs:
  ci:
    name: Build, lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # apps/ssh-cv is a Go binary, and turbo's check-types/test/build tasks
      # now cover it. The deploy job below deliberately does not install Go:
      # it only pushes Workers, and an SSH server cannot run on one.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/ssh-cv/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check for unused files/exports/dependencies (knip)
        run: bun run knip

      - name: Check for import cycles (madge)
        run: bun run check-cycles

      # apps/ssh-cv embeds a CV generated from packages/content. `bun run
      # build` regenerates it, so a diff here means the committed copy drifted
      # from the source module and the SSH CV would serve stale text.
      - name: Check the generated CV is up to date
        run: git diff --exit-code -- apps/ssh-cv/internal/cv/cv.json

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: eda936c59e56271336bc33974151f122
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # `wrangler` is a project dependency (installed via bun above), so we
      # call it directly instead of going through cloudflare/wrangler-action -
      # that action installs wrangler via a plain `npm i`, and wrangler's own
      # package.json declares `devEngines.packageManager: "bun"`, which npm
      # 10.9+ refuses to satisfy (EBADDEVENGINES), failing every run.
      - name: Deploy api
        working-directory: apps/api
        run: bunx wrangler deploy

      - name: Deploy web
        working-directory: apps/web
        run: bunx wrangler deploy

      - name: Deploy dashboard
        working-directory: apps/dashboard
        run: bunx wrangler deploy
