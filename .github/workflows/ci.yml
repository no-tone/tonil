name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check for unused files/exports/dependencies (knip)
        run: bun run knip

      - name: Check for import cycles (madge)
        run: bun run check-cycles

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: eda936c59e56271336bc33974151f122
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # `wrangler` is a project dependency (installed via bun above), so we
      # call it directly instead of going through cloudflare/wrangler-action —
      # that action installs wrangler via a plain `npm i`, and wrangler's own
      # package.json declares `devEngines.packageManager: "bun"`, which npm
      # 10.9+ refuses to satisfy (EBADDEVENGINES), failing every run.
      - name: Deploy api
        working-directory: apps/api
        run: bunx wrangler deploy

      - name: Deploy web
        working-directory: apps/web
        run: bunx wrangler deploy

      - name: Deploy dashboard
        working-directory: apps/dashboard
        run: bunx wrangler deploy
